<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiln Labs</title>
<meta name="description" content="Kiln Labs is pioneering the search engine for energy materials discovery.">
<meta name="theme-color" content="#06110a">
<meta property="og:title" content="Kiln Labs">
<meta property="og:description" content="Kiln Labs is pioneering the search engine for energy materials discovery.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://kilnlabs.studio">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06110a;
  --ink:#eef6e9;        /* main text: use a dark color here if your background is light */
  --mute:#9db79a;       /* labels and units */
  --faint:#6f8a6d;      /* decimals */
  --font:"Instrument Sans",Helvetica,Arial,sans-serif;
  --side:clamp(20px,2.5vw,48px);
  --top:clamp(20px,4.6vh,56px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
.page{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,#0c2412 0%,#06110a 70%)}
#shards,#vid{position:absolute;inset:0;width:100%;height:100%;display:block}
#vid{object-fit:cover;opacity:0;transition:opacity .6s ease}
#vid.on{opacity:1}
.brand{position:absolute;top:var(--top);left:var(--side);display:flex;align-items:center;gap:.55em;font-size:clamp(20px,1.55vw,30px);font-weight:500;letter-spacing:-.045em;line-height:1;padding-top:env(safe-area-inset-top,0px)}
.brand svg{width:.95em;height:1.1em;flex:none}
.tr{position:absolute;top:var(--top);right:var(--side);display:flex;align-items:flex-start;gap:clamp(12px,1.3vw,24px);padding-top:env(safe-area-inset-top,0px)}
.counters{display:grid;grid-template-columns:auto auto auto;column-gap:.9em;row-gap:.38em;align-items:baseline;font-size:clamp(13px,.9vw,17px);letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums;white-space:nowrap}
.counters .l{color:var(--mute)}
.counters .v{text-align:right}
.counters .d{color:var(--faint)}
.counters .u{color:var(--mute)}
.help{width:1.45vw;height:1.45vw;min-width:22px;min-height:22px;max-width:30px;max-height:30px;border:1px solid var(--mute);border-radius:50%;background:none;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin-top:-2px}
.help:focus-visible,a:focus-visible{outline:2px solid #32ca17;outline-offset:3px}
.note{position:absolute;top:calc(var(--top) + 4.2em);right:var(--side);max-width:260px;padding:14px 16px;font-size:14px;line-height:1.4;color:var(--ink);background:rgba(6,17,10,.88);border:1px solid rgba(157,183,154,.35);border-radius:10px;display:none}
.note.show{display:block}
.hero{position:absolute;left:50%;top:41%;transform:translate(-50%,-50%);width:calc(100% - 2 * var(--side));text-align:center}
h1{margin:0 auto;max-width:20em;font-size:clamp(26px,2.3vw,48px);line-height:1.12;font-weight:400;letter-spacing:-.035em;text-wrap:balance}
.email{display:inline-block;margin-top:clamp(28px,5.6vh,64px);font-size:clamp(15px,1.1vw,21px);letter-spacing:-.02em;padding-bottom:2px;border-bottom:1px solid currentColor;transition:opacity .15s}
.email:hover,.foot a:hover{opacity:.6}
.foot{position:absolute;right:var(--side);bottom:calc(var(--top) * .75 + env(safe-area-inset-bottom,0px));display:flex;gap:clamp(16px,1.8vw,34px);font-size:clamp(14px,.9vw,17px);letter-spacing:-.02em;line-height:1}
@media (max-width:760px){
  :root{--side:22px;--top:22px}
  .brand{font-size:21px}
  .tr{top:calc(var(--top) + 46px);left:var(--side);right:auto;flex-direction:row-reverse;justify-content:flex-end}
  .counters{font-size:12.5px;column-gap:.7em}
  .note{top:calc(var(--top) + 150px);left:var(--side);right:auto}
  .hero{top:47%}
  h1{font-size:clamp(27px,7.6vw,38px);max-width:14em}
  .email{font-size:16px}
  .foot{font-size:15px}
}
@media (prefers-reduced-motion:reduce){#vid{transition:none}}
</style>
</head>
<body>
<main class="page">
  <canvas id="shards" aria-hidden="true"></canvas>
  <!-- OPTIONAL: export your React Bits background as a looping video, name it background.mp4, and put it next to this file. It fades in over the canvas automatically. -->
  <video id="vid" muted loop playsinline preload="auto" aria-hidden="true"><source src="background.mp4" type="video/mp4"></video>

  <a class="brand" href="/" aria-label="Kiln Labs home">
    <svg viewBox="0 0 22 26" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M11 1.5 20 8v10L11 24.5 2 18V8z"/><path d="M11 1.5v23M2 8l9 5 9-5"/>
    </svg>
    <span>Kiln Labs</span>
  </a>

  <div class="tr">
    <div class="counters" role="group" aria-label="Kiln Labs activity">
      <span class="l">Screened</span><span class="v"><span data-w="screened"></span><span class="d" data-d="screened"></span></span><span class="u">materials</span>
      <span class="l">Ranked</span><span class="v"><span data-w="ranked"></span><span class="d" data-d="ranked"></span></span><span class="u">candidates</span>
      <span class="l">Discovered</span><span class="v"><span data-w="discovered"></span><span class="d" data-d="discovered"></span></span><span class="u">materials</span>
    </div>
    <button class="help" id="help" type="button" aria-expanded="false" aria-controls="note" aria-label="About these numbers">?</button>
  </div>
  <div class="note" id="note" role="note">Running totals from the Kiln Labs materials search engine.</div>

  <section class="hero">
    <h1>Kiln Labs is pioneering the search engine for energy materials discovery.</h1>
    <a class="email" href="mailto: contact@kilnlabs.studio ">contact@kilnlabs.studio</a>
  </section>

  <nav class="foot" aria-label="Social links">
    <a href="https://x.com/" target="_blank" rel="noopener noreferrer">X</a>
    <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
  </nav>
</main>

<script>
/* ===== EDIT THESE =====
   Counters: replace start values and rates (per second) with real platform data before you share the site.
   Shards: change colors, speed, and glow to taste. */
var COUNTERS={
  screened:{start:48210,rate:2.6},
  ranked:{start:6934,rate:.35},
  discovered:{start:0,rate:0}
};
var SHARD=[50,202,23], ACCENT=[43,123,12], SPEED=1.2, GLOW=.55;

/* ---------- counters ---------- */
var t0=performance.now();
function counters(now){
  var s=(now-t0)/1000;
  for(var k in COUNTERS){
    var v=COUNTERS[k].start+COUNTERS[k].rate*s, w=Math.floor(v);
    document.querySelector('[data-w="'+k+'"]').textContent=w.toLocaleString('en-US');
    document.querySelector('[data-d="'+k+'"]').textContent=(v-w).toFixed(6).slice(1);
  }
}

/* ---------- help note ---------- */
var help=document.getElementById('help'), note=document.getElementById('note');
help.addEventListener('click',function(){var o=note.classList.toggle('show');help.setAttribute('aria-expanded',o)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){note.classList.remove('show');help.setAttribute('aria-expanded',false)}});

/* ---------- crystal shards (canvas) ---------- */
var cv=document.getElementById('shards'), g=cv.getContext('2d'), W,H,DPR,shards=[];
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
function rgba(c,a){return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a.toFixed(3)+')'}
function build(){
  seed=7;shards=[];
  var n=Math.round(Math.min(48,Math.max(22,W*H/40000)));
  for(var i=0;i<n;i++){
    var z=.3+rnd()*.7, h=(50+rnd()*170)*(.5+z*.7);
    shards.push({x:rnd()*W,y:rnd()*H,z:z,h:h,w:h*(.15+rnd()*.12),rot:(rnd()-.5)*1.1,
      sp:rnd()*6.28,spv:(rnd()-.5)*.7,vy:(5+rnd()*13)*z,vx:(rnd()-.5)*5*z,sw:rnd()*6.28});
  }
  shards.sort(function(a,b){return a.z-b.z});
}
function size(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);g.setTransform(DPR,0,0,DPR,0,0);build();
}
function drawShard(s,t){
  var k=Math.cos(s.sp+t*s.spv*SPEED), ax=Math.abs(k), w=s.w*(.28+.72*ax), h=s.h, rx=k*w*.55;
  var dx=(s.x-W/2)/(W*.3), dy=(s.y-H*.42)/(H*.2), m=Math.min(1,dx*dx+dy*dy);
  var a=(.28+.6*s.z)*(.22+.78*m);
  g.save();g.translate(s.x,s.y);g.rotate(s.rot+Math.sin(t*.25*SPEED+s.sw)*.06);
  var lightLeft=k<0;
  g.beginPath();g.moveTo(0,-h);g.lineTo(-w,-h*.4);g.lineTo(-w,h*.4);g.lineTo(0,h);g.lineTo(rx,0);g.closePath();
  g.fillStyle=rgba(lightLeft?SHARD:ACCENT,a*(lightLeft?.55:.7));g.fill();
  g.beginPath();g.moveTo(0,-h);g.lineTo(w,-h*.4);g.lineTo(w,h*.4);g.lineTo(0,h);g.lineTo(rx,0);g.closePath();
  g.fillStyle=rgba(lightLeft?ACCENT:SHARD,a*(lightLeft?.7:.55));g.fill();
  g.beginPath();g.moveTo(0,-h);g.lineTo(w,-h*.4);g.lineTo(w,h*.4);g.lineTo(0,h);g.lineTo(-w,h*.4);g.lineTo(-w,-h*.4);g.closePath();
  g.globalCompositeOperation='lighter';
  g.strokeStyle=rgba(SHARD,a*.16*GLOW);g.lineWidth=7*s.z;g.stroke();
  g.strokeStyle=rgba(SHARD,a*.9);g.lineWidth=1;g.stroke();
  g.beginPath();g.moveTo(0,-h);g.lineTo(rx,0);g.lineTo(0,h);g.moveTo(-w,-h*.4);g.lineTo(rx,0);g.lineTo(w,-h*.4);
  g.strokeStyle=rgba(SHARD,a*.5);g.stroke();
  g.restore();
}
var last=0;
function frame(now){
  var t=now/1000, dt=Math.min(.05,(now-(last||now))/1000);last=now;
  g.clearRect(0,0,W,H);
  for(var i=0;i<shards.length;i++){
    var s=shards[i];s.y-=s.vy*dt*SPEED;s.x+=s.vx*dt*SPEED;
    if(s.y<-s.h*1.2){s.y=H+s.h*1.2;s.x=rnd()*W}
    if(s.x<-s.w*2)s.x=W+s.w;if(s.x>W+s.w*2)s.x=-s.w;
    drawShard(s,t);
  }
}

/* ---------- optional video (fades in if background.mp4 exists) ---------- */
var vid=document.getElementById('vid'), videoOn=false;
vid.addEventListener('loadeddata',function(){videoOn=true;vid.classList.add('on');cv.style.display='none';if(!reduce)vid.play().catch(function(){})});

var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
size();
addEventListener('resize',function(){size();if(reduce)frame(4000)});
function loop(now){counters(now);if(!videoOn)frame(now);requestAnimationFrame(loop)}
if(reduce){counters(t0);frame(4000)}else{requestAnimationFrame(loop)}
</script>
</body>
</html>
