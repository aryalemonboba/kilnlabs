<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiln Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{--c0:#EAF3E0;--c1:#D3E8C0;--c2:#A8D18C;--c3:#6BA84F;--c4:#2F6A2A;--ink:#10240f;--soft:#3d5a39;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c0:#0C1A0E;--c1:#13291A;--c2:#1F4A28;--c3:#3B7D3F;--c4:#8BC96A;--ink:#EAF5E2;--soft:#A9C79B;color-scheme:dark}}
:root[data-theme="dark"]{--c0:#0C1A0E;--c1:#13291A;--c2:#1F4A28;--c3:#3B7D3F;--c4:#8BC96A;--ink:#EAF5E2;--soft:#A9C79B;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--c0);color:var(--ink);font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.page{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:32px clamp(20px,5vw,72px) 36px;box-sizing:border-box}
.mark{font-size:28px;font-weight:700;letter-spacing:-.02em}
h1{margin:0;font-size:clamp(40px,6.4vw,92px);line-height:1;font-weight:600;letter-spacing:-.035em;max-width:11ch}
.sub{font-family:Newsreader,Georgia,serif;font-size:clamp(20px,2vw,26px);line-height:1.4;color:var(--soft);max-width:34ch;margin:22px 0 0}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap}
a{color:var(--ink);font-size:18px;text-decoration:underline;text-underline-offset:4px}
a:focus-visible{outline:3px solid var(--c3);outline-offset:4px}
.counters{display:flex;gap:clamp(20px,3.5vw,48px);text-align:right}
.n{font-size:clamp(26px,2.8vw,38px);font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.l{font-size:15px;color:var(--soft);margin-top:4px}
@media (max-width:700px){.counters{text-align:left;width:100%;justify-content:space-between}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="page">
  <div class="mark">Kiln Labs</div>
  <main>
    <h1>A search engine for energy materials.</h1>
    <p class="sub">Tell us where the system will run and what matters most. We find and rank the materials that fit.</p>
  </main>
  <div class="foot">
    <a href="mailto:hello@kilnlabs.studio">hello@kilnlabs.studio</a>
    <div class="counters" aria-label="Platform activity">
      <div><div class="n" id="c-screened">0</div><div class="l">Materials screened</div></div>
      <div><div class="n" id="c-ranked">0</div><div class="l">Candidates ranked</div></div>
      <div><div class="n" id="c-discovered">0</div><div class="l">Materials discovered</div></div>
    </div>
  </div>
</div>
<script>
(function(){
// EDIT THESE: replace the start values and rates with your real platform numbers before you share the site.
var COUNTERS=[
 {id:'c-screened',start:48210,rate:2.6},
 {id:'c-ranked',start:6934,rate:0.35},
 {id:'c-discovered',start:0,rate:0}
];
var EPOCH=Date.UTC(2026,9,29);
function tick(){var s=(Date.now()-EPOCH)/1000;COUNTERS.forEach(function(c){var el=document.getElementById(c.id);if(el)el.textContent=Math.floor(c.start+c.rate*s).toLocaleString('en-US')})}
tick();setInterval(tick,150);

var cs=getComputedStyle(document.documentElement);
function hex(h){h=h.trim().replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function pal(){return[0,1,2,3,4].map(function(i){return hex(cs.getPropertyValue('--c'+i))})}
var P=pal();
if(matchMedia){try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){P=pal()})}catch(e){}}

var seed=11;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
var atoms=[],bonds=[],owner=[];
function add(x,y,z,r,o){atoms.push([x,y,z,r]);owner.push(o);return atoms.length-1}
function ring(cx,cy,cz,o){
  var a=rnd()*6.28,b=rnd()*6.28,ids=[],k,t,x,y,z,y1,z1,x2,z2;
  for(k=0;k<6;k++){t=k*Math.PI/3;x=Math.cos(t)*.5;y=Math.sin(t)*.5;z=0;
    y1=y*Math.cos(a)-z*Math.sin(a);z1=y*Math.sin(a)+z*Math.cos(a);
    x2=x*Math.cos(b)+z1*Math.sin(b);z2=-x*Math.sin(b)+z1*Math.cos(b);
    ids.push(add(cx+x2,cy+y1,cz+z2,1,o))}
  for(k=0;k<6;k++)bonds.push([ids[k],ids[(k+1)%6]]);
  if(rnd()<.75){var i=ids[(rnd()*6)|0],A=atoms[i];
    bonds.push([i,add(cx+(A[0]-cx)*2.2,cy+(A[1]-cy)*2.2,cz+(A[2]-cz)*2.2,.7,o)])}
}
var i,j;
for(i=0;i<18;i++)ring((rnd()-.5)*12,(rnd()-.5)*6.5,(rnd()-.5)*6,i);
var n0=atoms.length;
for(i=0;i<n0;i++)for(j=i+1;j<n0;j++){if(owner[i]!==owner[j]){var dx=atoms[i][0]-atoms[j][0],dy=atoms[i][1]-atoms[j][1],dz=atoms[i][2]-atoms[j][2];if(dx*dx+dy*dy+dz*dz<1.5)bonds.push([i,j])}}
var g=[],X,Y,Z;
for(X=0;X<5;X++)for(Y=0;Y<3;Y++)for(Z=0;Z<3;Z++){g[X*9+Y*3+Z]=add(2.2+X*.85,-1.2+Y*.85,-1+Z*.85,.8,99)}
for(X=0;X<5;X++)for(Y=0;Y<3;Y++)for(Z=0;Z<3;Z++){var q=g[X*9+Y*3+Z];
  if(X<4)bonds.push([q,g[(X+1)*9+Y*3+Z]]);if(Y<2)bonds.push([q,g[X*9+(Y+1)*3+Z]]);if(Z<2)bonds.push([q,g[X*9+Y*3+Z+1]])}

var out=document.getElementById('bg'),octx=out.getContext('2d');
var work=document.createElement('canvas'),wctx=work.getContext('2d',{willReadFrequently:true});
var W,H,PX,img;
function size(){PX=innerWidth<700?3:4;W=Math.ceil(innerWidth/PX);H=Math.ceil(innerHeight/PX);
  out.width=work.width=W;out.height=work.height=H;img=octx.createImageData(W,H)}
size();
var B=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
var D=9,AX=.38;
function frame(t){
  var ay=t*.00005,ca=Math.cos(ay),sa=Math.sin(ay),cx=Math.cos(AX),sx=Math.sin(AX),f=H*.62,k;
  wctx.globalCompositeOperation='source-over';wctx.fillStyle='#000';wctx.fillRect(0,0,W,H);
  wctx.globalCompositeOperation='lighter';
  var pr=new Array(atoms.length);
  for(k=0;k<atoms.length;k++){var a=atoms[k],x=a[0]*ca+a[2]*sa,z=-a[0]*sa+a[2]*ca,y=a[1]*cx-z*sx,zz=a[1]*sx+z*cx,s=f/(D+zz);
    pr[k]=[W*.5+x*s,H*.4+y*s,s,Math.max(.25,Math.min(1,1.25*D/(D+zz)-.2))]}
  for(k=0;k<bonds.length;k++){var p=pr[bonds[k][0]],q=pr[bonds[k][1]],d=(p[3]+q[3])/2;
    wctx.strokeStyle='rgba(255,255,255,'+(.55*d).toFixed(2)+')';wctx.lineWidth=Math.max(1,(p[2]+q[2])*.012);
    wctx.beginPath();wctx.moveTo(p[0],p[1]);wctx.lineTo(q[0],q[1]);wctx.stroke()}
  for(k=0;k<atoms.length;k++){var u=pr[k],r=atoms[k][3]*u[2]*.1,gr=wctx.createRadialGradient(u[0],u[1],0,u[0],u[1],r);
    gr.addColorStop(0,'rgba(255,255,255,'+u[3].toFixed(2)+')');gr.addColorStop(1,'rgba(255,255,255,0)');
    wctx.fillStyle=gr;wctx.fillRect(u[0]-r,u[1]-r,r*2,r*2)}
  var src=wctx.getImageData(0,0,W,H).data,dst=img.data,xx,yy,r1=[],r2=[];
  for(xx=0;xx<W;xx++){r1[xx]=H*.8+Math.sin(xx*.012+t*.00002)*H*.03+Math.sin(xx*.031)*H*.014;r2[xx]=H*.9+Math.sin(xx*.02+1.7)*H*.025+Math.sin(xx*.05)*H*.01}
  for(yy=0;yy<H;yy++)for(xx=0;xx<W;xx++){
    var o=(yy*W+xx)*4,lum=src[o]/255,dx=xx/W/.62,dy=yy/H/.58,pt=Math.max(0,1-(dx*dx+dy*dy));
    lum*=1-.85*pt;
    var v=lum+(yy>r1[xx]?.2:0)+(yy>r2[xx]?.2:0)+(yy/H)*.08;
    var lv=Math.floor(v*4+B[(yy&3)*4+(xx&3)]/16-.5+.5);lv=lv<0?0:lv>4?4:lv;var c=P[lv];
    dst[o]=c[0];dst[o+1]=c[1];dst[o+2]=c[2];dst[o+3]=255}
  octx.putImageData(img,0,0)}
var reduce=matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches,last=0;
function loop(t){if(t-last>33){last=t;frame(t)}requestAnimationFrame(loop)}
addEventListener('resize',function(){size();frame(performance.now())});
if(reduce)frame(60000);else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
